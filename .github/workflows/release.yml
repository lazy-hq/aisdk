name: release

# Publishes to crates.io via trusted publishing. The crates.io trusted
# publisher is registered for this file name and the `release` environment.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write # crates.io trusted publishing (OIDC)
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # No build cache: a publishing job should not restore artifacts written
      # by other runs.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-release@0.25
      - run: cargo test --all-features
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # --workspace: without it only the root package (aisdk) is selected and
      # a new aisdk-macros version is never published. Versions already on
      # crates.io are skipped.
      - run: cargo release publish --workspace --execute --no-confirm --allow-branch '*'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
